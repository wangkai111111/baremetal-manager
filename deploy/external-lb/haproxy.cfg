# 多机部署外置 HAProxy 示例。
# 将下方节点地址替换为各宿主机上发布的端口；建议在此层终止 TLS，
# 并通过防火墙只允许 LB 访问节点端口。LB 本身应至少双机并配合 VIP/云负载均衡。
global
    log stdout format raw local0
    maxconn 8192

 defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout tunnel 16m
    timeout client 60s
    timeout server 60s

frontend public_http
    bind :80
    default_backend bmm_nodes

backend bmm_nodes
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    # WebSocket / SOL 会话需要更长的空闲超时。
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout tunnel 20m
    # 每台节点运行本目录根部 Compose 的 lb 服务，并发布 HTTP_PORT。
    server node-1 192.0.2.11:8080 check inter 5s fall 3 rise 2
    server node-2 192.0.2.12:8080 check inter 5s fall 3 rise 2
    server node-3 192.0.2.13:8080 check inter 5s fall 3 rise 2 backup
