global
    log stdout format raw local0
    maxconn 4096
    # 容器内以前台、非特权方式运行。
    user haproxy
    group haproxy

 defaults
    log global
    mode http
    option httplog
    option dontlognull
    option redispatch
    timeout connect 5s
    # SOL WebSocket 最长保留十五分钟；其他 HTTP 请求仍受后端自身超时控制。
    timeout tunnel 16m
    # 全局默认超时；WebSocket 路径单独放宽到 30 分钟（见下）。
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    retries 3

# 跟踪 Compose 服务地址，避免容器更新 IP 后仍向旧地址转发。
resolvers docker_dns
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s

frontend public_http
    bind :8080
    # Only a configured upstream proxy (e.g. the host Vite server) may supply XFF.
    # Public clients always get their TCP peer address, regardless of supplied headers.
    acl trusted_forwarder src "${TRUSTED_UPSTREAM_PROXY}"
    http-request del-header Forwarded
    http-request del-header X-Real-IP
    http-request set-header X-Forwarded-For "%[req.hdr(X-Forwarded-For)], %[src]" if trusted_forwarder { req.hdr(X-Forwarded-For) -m found }
    http-request set-header X-Forwarded-For %[src] unless trusted_forwarder
    http-request set-header X-Forwarded-For %[src] unless { req.hdr(X-Forwarded-For) -m found }
    # API 与健康检查进入后端池，其余请求进入静态前端池。
    acl api_path path_beg /api/ /health /ready
    use_backend api_nodes if api_path
    default_backend frontend_nodes

backend api_nodes
    option httpchk GET /health
    http-check expect status 200
    # SOL WebSocket 需要更长的空闲超时，避免被网关提前切断。
    timeout connect 10s
    timeout server 30m
    timeout tunnel 20m
    server backend backend:8000 check inter 5s fall 3 rise 2 resolvers docker_dns init-addr libc,none resolve-prefer ipv4

backend frontend_nodes
    option httpchk GET /health
    http-check expect status 200
    server frontend frontend:8080 check inter 5s fall 3 rise 2 resolvers docker_dns init-addr libc,none resolve-prefer ipv4

# 仅供运维探针与内部监控；生产环境应通过防火墙限制访问。
listen stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    http-request use-service prometheus-exporter if { path /metrics }
    monitor-uri /health
