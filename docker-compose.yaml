name: baremetal-manager

# 通用安全与资源限制；生产环境应结合节点容量调整。
x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  networks:
    - app-net
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-backend-common: &backend-common
  <<: *service-defaults
  # 本地构建镜像，也可通过 BACKEND_IMAGE 指向预构建镜像。
  build:
    context: ./backend
  image: ${BACKEND_IMAGE:-baremetal-manager/backend:latest}
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the target database and application role}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
    BMC_ENCRYPTION_KEY: ${BMC_ENCRYPTION_KEY:?Set BMC_ENCRYPTION_KEY to a 32-byte key}
    SOL_ALLOWED_ORIGIN: ${SOL_ALLOWED_ORIGIN:-http://localhost:8080}
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-bmm-minio}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET:-baremetal-images}
    PXE_TFTP_ROOT: /var/lib/tftpboot
    PXE_HTTP_BASE: ${PXE_HTTP_BASE:-http://192.168.77.1:18080/api/v1/provision}

    # 告警推送配置
    ALERT_WECHAT_WEBHOOK: ${ALERT_WECHAT_WEBHOOK:-}
    ALERT_DINGTALK_WEBHOOK: ${ALERT_DINGTALK_WEBHOOK:-}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
    ALERT_SMTP_PORT: "${ALERT_SMTP_PORT:-587}"
    ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
    ALERT_SMTP_PASS: ${ALERT_SMTP_PASS:-}

    # 传感器采集配置
    SENSOR_INTERVAL: "${SENSOR_INTERVAL:-300}"

    # BMC 并发限流
    BMC_MAX_CONCURRENT: "${BMC_MAX_CONCURRENT:-10}"
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  expose:
    - "8000"
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  healthcheck:
    # Alpine 运行镜像自带 BusyBox wget，可直接检查健康端点。
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  deploy:
    resources:
      limits:
        cpus: "1.00"
        memory: 1G
      reservations:
        memory: 256M

x-frontend-common: &frontend-common
  <<: *service-defaults
  build:
    context: ./frontend
  image: ${FRONTEND_IMAGE:-baremetal-manager/frontend:latest}
  expose:
    - "8080"
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
    - /var/cache/nginx:size=64m,mode=0755
    - /var/run:size=8m,mode=0755
  # nginx 需要权限处理临时目录和用户切换
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - SETGID
    - SETUID
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 15s
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M

services:
  # 唯一结构变更入口；失败时 API/worker 不启动，旧数据卷保持不变。
  migrate:
    <<: *service-defaults
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-baremetal-manager/backend:latest}
    restart: "no"
    command: ["migrate"]
    environment:
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL using the database owner}
      DATABASE_APP_USER: ${DATABASE_APP_USER:-bmm_app}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?Set DATABASE_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bmm_target}
      POSTGRES_USER: ${POSTGRES_USER:-bmm_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/postgres/healthcheck.sh:/usr/local/bin/bmm-pg-healthcheck:ro
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD", "/usr/local/bin/bmm-pg-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          memory: 512M

  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:7-alpine}
    # 以 root 用户运行，避免数据目录权限问题
    user: "0"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  minio:
    <<: *service-defaults
    # 可通过 MINIO_IMAGE 指向私有的 MinIO 兼容镜像仓库。
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bmm-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "0.0.0.0:${MINIO_PORT:-19000}:9000"
      - "0.0.0.0:${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          memory: 256M

  minio-init:
    <<: *service-defaults
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bmm-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-baremetal-images}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    volumes:
      - ./deploy/minio/init-bucket.sh:/usr/local/bin/init-bucket:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-bucket"]
    tmpfs:
      - /tmp:size=16m,mode=1777
      # mc 工具需要写入配置目录
      - /root/.mc:size=16m,mode=0755

  backend:
    <<: *backend-common
    group_add: ["2000"]
    volumes:
      - pxe-control:/run/bmm-pxe:ro
      - ./provisioning/tftp:/var/lib/tftpboot:ro
      - ./provisioning/iso:/var/lib/tftpboot/iso:ro
      - ./provisioning/netboot:/var/lib/tftpboot/netboot:ro

  worker:
    <<: *backend-common
    # 后端镜像入口统一使用 /app/server，worker 作为命令参数。
    command: ${WORKER_COMMAND:-worker}
    # ISO 下载临时文件使用磁盘卷，避免继承 128 MB 的内存临时目录。
    tmpfs: []
    group_add: ["2000"]
    volumes:
      - image-download-temp:/tmp
      - pxe-control:/run/bmm-pxe:ro
      - ./provisioning/tftp:/var/lib/tftpboot
      - ./provisioning/iso:/var/lib/tftpboot/iso:ro
      - ./provisioning/netboot:/var/lib/tftpboot/netboot:ro
    expose: []
    healthcheck:
      disable: true

  scheduler:
    <<: *backend-common
    command: ${SCHEDULER_COMMAND:-scheduler}
    expose: []
    healthcheck:
      disable: true

  frontend:
    <<: *frontend-common
    depends_on:
      backend:
        condition: service_healthy

  lb:
    <<: *service-defaults
    image: ${HAPROXY_IMAGE:-haproxy:3.0-alpine}
    environment:
      TRUSTED_UPSTREAM_PROXY: ${TRUSTED_UPSTREAM_PROXY:-127.0.0.1}
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${HAPROXY_STATS_PORT:-8404}:8404"
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 15s
      timeout: 5s
      retries: 5
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/lib/haproxy:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M

  # 仅监管固定 DHCP/TFTP 子进程；每次容器启动两者均关闭，须管理员明确启用。
  pxe-services:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-baremetal-manager/backend:latest}
    command: ["pxe-services"]
    restart: unless-stopped
    user: "0:2000"
    network_mode: host
    environment:
      DATABASE_URL: ${PXE_DATABASE_URL:-${DATABASE_URL}}
      PXE_DB_HOST: ${PXE_DB_HOST:-127.0.0.1}
      PXE_DB_PORT: ${DB_PORT:-25432}
    volumes:
      - pxe-control:/run/bmm-pxe
      - pxe-state:/var/lib/bmm-pxe
      - ./provisioning/tftp:/var/lib/tftpboot
    devices:
      - /dev/net/tun:/dev/net/tun
      - /dev/kvm:/dev/kvm
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    security_opt:
      - no-new-privileges:true

networks:
  app-net:
    driver: bridge
    internal: false

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:-baremetal-manager-target-pgdata}
  redis-data:
  minio-data:
  image-download-temp:
  tftp-data:
  pxe-control:
  pxe-state:
